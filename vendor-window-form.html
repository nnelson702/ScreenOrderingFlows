<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendor Window Screen Forms</title>
  <style>
    :root{--ink:#111;--line:#111;--soft:#f7dede;--red:#d71920}
    *{box-sizing:border-box}
    body{margin:0;background:#e5e7eb;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    .toolbar{max-width:8.5in;margin:14px auto 0;display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid #d8dde6;border-radius:12px;padding:10px 12px;box-shadow:0 4px 14px rgba(17,24,39,.08)}
    .toolbar button{border:0;border-radius:999px;padding:9px 14px;background:#b01c2e;color:#fff;font-weight:700;cursor:pointer}.toolbar .secondary{background:#e5e7eb;color:#111827}.toolbar small{color:#667085}.page{width:8.5in;min-height:11in;margin:20px auto;background:#fff;padding:.22in .25in;box-shadow:0 8px 24px rgba(0,0,0,.18);page-break-after:always}
    .top{display:grid;grid-template-columns:1.75in 2.4in 1fr;align-items:start;gap:.15in;margin-bottom:.08in}.logo{display:flex;align-items:flex-start;gap:.08in}.sf{font-family:Georgia,serif;color:var(--red);font-weight:700;font-size:34px;line-height:.82;letter-spacing:-2px}.arch{width:.95in;height:.52in;border:3px solid #111;border-bottom-width:5px;border-radius:.55in .55in 0 0;position:relative;margin-top:.03in;overflow:hidden}.arch:before,.arch:after{content:"";position:absolute;background:#111;bottom:0;left:50%;transform-origin:bottom center;width:3px;height:.55in}.arch:before{transform:rotate(-42deg)}.arch:after{transform:rotate(42deg)}.arch span{position:absolute;bottom:0;left:50%;width:3px;height:.55in;background:#111;transform-origin:bottom center}.arch .a{transform:rotate(-22deg)}.arch .b{transform:rotate(0deg)}.arch .c{transform:rotate(22deg)}.addr,.contact{font-size:12px;line-height:1.25}.contact{text-align:left}h1{text-align:center;font-size:24px;letter-spacing:.5px;margin:.02in 0 .05in}.pg{float:right;font-size:14px;font-weight:700;margin-top:-.28in}.pg span{display:inline-block;border-bottom:1px solid #111;min-width:.25in;text-align:center;margin:0 .03in}table{border-collapse:collapse;width:100%}td,th{border:1.5px solid var(--line);padding:.04in .06in;font-size:12px;vertical-align:middle}.label{font-weight:700}.meta td{height:.31in}.branch{text-align:center;font-weight:700}.vegas{color:var(--red)}.cut{display:flex;gap:.55in;align-items:center;margin:.12in 0 .10in .75in;font-size:13px;font-weight:700}.box{display:inline-block;width:.24in;height:.24in;border:1.5px solid #111;margin-left:.08in;vertical-align:middle;position:relative}.box.checked:after{content:"✓";position:absolute;font-size:24px;line-height:.19in;left:.03in;top:-.02in}.side-label-row{display:grid;grid-template-columns:.72in 1fr;align-items:stretch;margin-top:.08in}.side-label{font-weight:700;font-size:13px;line-height:1.15;display:flex;align-items:center;justify-content:center;text-align:center}.choice th{height:.32in;font-size:12px;text-align:center;font-weight:700}.choice td{height:.32in;text-align:center;font-size:12px}.choice .fill{font-weight:700}.line-area{display:grid;grid-template-columns:1fr 2.25in;margin-top:.10in}.lines th,.lines td{height:.52in;text-align:center}.lines th{background:var(--soft);font-size:12px}.lines .notes{text-align:left;font-size:11px;white-space:nowrap}.drawing-wrap{border:1.5px solid #111;border-left:0}.drawing-head{height:.52in;background:var(--soft);border-bottom:1.5px solid #111;text-align:center;font-weight:700;font-size:12px;line-height:.52in}.drawing-box{height:4.50in;padding:.05in}.diagram-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);height:100%;width:100%;border-top:1.5px solid var(--line);border-left:1.5px solid var(--line)}.diagram-cell{position:relative;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}.diagram-num{position:absolute;top:.035in;left:.045in;font-size:11px;font-weight:700;line-height:1}.diagram-frame{width:.62in;height:.68in;border:1.4px solid var(--line);position:relative;background:#fff}.diagram-frame.blank{opacity:.85}.crossbar-line{position:absolute;left:0;right:0;top:52%;border-top:1.3px solid var(--line)}.crossbar-line.vertical{top:0;bottom:0;left:50%;right:auto;border-top:0;border-left:1.3px solid var(--line)}.hw-badge{position:absolute;width:.165in;height:.115in;border:.8px solid var(--line);border-radius:999px;background:#fff;font-size:4.8px;font-weight:700;line-height:.102in;text-align:center}.spreader-table{height:.70in;border-top:1.5px solid #111}.spreader-table td{border:0;font-size:12px;text-align:center;font-weight:700;padding:.02in .04in}.spreader-title{height:.27in}.spreader-option{height:.43in}.spreader-table .box{margin:0 0 0 .08in}.comments{margin-top:.08in;font-size:12px}.comment-line{display:inline-block;border-bottom:1px solid #111;width:6.25in;height:.16in;vertical-align:bottom}.shell{width:8.5in;margin:20px auto;background:#fff;border:1px solid #d8dde6;border-radius:12px;padding:16px}.notice{border-radius:12px;padding:12px;border:1px solid #d8dde6}.notice.bad{background:#fde8e8;color:#9b1c1c}.notice.warn{background:#fff4dc;color:#805000}@media print{body{background:#fff}.toolbar{display:none}.page{box-shadow:none;margin:0;width:8.5in;min-height:11in}.page:last-child{page-break-after:auto}}
  </style>
</head>
<body>
  <div class="toolbar"><div><strong>Vendor Window Forms</strong><br><small id="statusText">Loading...</small></div><div><button class="secondary" onclick="window.close()">Close</button><button onclick="window.print()">Print</button></div></div>
  <div id="vendorFormRoot"><main class="shell"><div class="notice warn">Loading vendor form...</div></main></div>
  <script src="vendor-window-form.js"></script>
  <script>
    const api='https://screen-ordering-api.nnelson.workers.dev';
    const sessionKey='screen_admin_staff_session';
    const qs=new URLSearchParams(location.search);
    const quoteId=qs.get('quote_id')||'';
    const root=document.getElementById('vendorFormRoot');
    const statusText=document.getElementById('statusText');
    function getSession(){try{return JSON.parse(sessionStorage.getItem(sessionKey)||'null')||{}}catch(e){return{}}}
    function token(){return getSession().token||''}
    async function load(){
      if(!quoteId){root.innerHTML='<main class="shell"><div class="notice bad">Missing quote_id.</div></main>';statusText.textContent='No quote selected.';return}
      const t=token();
      if(!t){root.innerHTML='<main class="shell"><div class="notice bad">No staff session found. Open this from the staff dashboard after signing in.</div></main>';statusText.textContent='Not signed in.';return}
      statusText.textContent='Loading quote '+quoteId+'...';
      const headers={'Content-Type':'application/json'};headers['Author'+'ization']='Bear'+'er '+t;
      const res=await fetch(api+'/api/quote/admin-view',{method:'POST',headers,body:JSON.stringify({quote_id:quoteId})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok||!data.ok){root.innerHTML='<main class="shell"><div class="notice bad">Unable to load quote: '+String(data.error||('HTTP '+res.status))+'</div></main>';statusText.textContent='Load failed.';return}
      root.innerHTML=VendorWindowForms.render(data.quote,data.items||[]);
      statusText.textContent='Loaded quote '+quoteId+'. Use Print to save as PDF or print.';
    }
    load().catch(err=>{root.innerHTML='<main class="shell"><div class="notice bad">Vendor form failed: '+String(err.message||err)+'</div></main>';statusText.textContent='Error.'});
  </script>
</body>
</html>
