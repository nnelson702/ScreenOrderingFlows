center}.choice th{height:.32in;font-size:12px;text-align:center;font-weight:700}.choice td{height:.32in;text-align:center;font-size:12px}.choice .fill{font-weight:700}.line-area{display:grid;grid-template-columns:1fr 2.25in;margin-top:.10in}.lines th,.lines td{height:.52in;text-align:center}.lines th{background:var(--soft);font-size:12px}.lines .notes{text-align:left;font-size:11px;white-space:nowrap}.drawing-wrap{border:1.5px solid #111;border-left:0}.drawing-head{height:.52in;background:var(--soft);border-bottom:1.5px solid #111;text-align:center;font-weight:700;font-size:12px;line-height:.52in}.drawing-box{height:4.50in;padding:.05in}.diagram-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);height:100%;width:100%;border-top:1.5px solid var(--line);border-left:1.5px solid var(--line)}.diagram-cell{position:relative;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}.diagram-num{position:absolute;top:.035in;left:.045in;font-size:11px;font-weight:700;line-height:1}.diagram-frame{width:.62in;height:.68in;border:1.4px solid var(--line);position:relative;background:#fff}.diagram-frame.blank{opacity:.85}.crossbar-line{position:absolute;left:0;right:0;top:52%;border-top:1.3px solid var(--line)}.crossbar-line.vertical{top:0;bottom:0;left:50%;right:auto;border-top:0;border-left:1.3px solid var(--line)}.hw-badge{position:absolute;width:.165in;height:.115in;border:.8px solid var(--line);border-radius:999px;background:#fff;font-size:4.8px;font-weight:700;line-height:.102in;text-align:center}.spreader-table{height:.70in;border-top:1.5px solid #111}.spreader-table td{border:0;font-size:12px;text-align:center;font-weight:700;padding:.02in .04in}.spreader-title{height:.27in}.spreader-option{height:.43in}.spreader-table .box{margin:0 0 0 .08in}.comments{margin-top:.08in;font-size:12px}.comment-line{display:inline-block;border-bottom:1px solid #111;width:6.25in;height:.16in;vertical-align:bottom}
    .patio-page .arch:before,.patio-page .arch:after,.patio-page .arch span{display:none}.patio-row{display:grid;grid-template-columns:.72in 1fr;margin-top:.08in}.patio-side{border:1.5px solid #111;border-right:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:13px;line-height:1.15}.patio-choice th,.patio-choice td{height:.34in;text-align:center}.patio-choice .fill{font-weight:700}.patio-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.08in;margin-top:.08in}.patio-control{border:1.5px solid #111;min-height:.54in;padding:.05in .08in;font-size:12px;font-weight:700}.patio-control-line{display:flex;gap:.16in;align-items:center;justify-content:center;margin-top:.05in;flex-wrap:wrap}.patio-bottom{display:grid;grid-template-columns:1fr 2.25in;margin-top:.10in}.patio-lines th{height:.44in;background:var(--soft);text-align:center}.patio-lines td{height:.86in;text-align:center}.patio-lines .comment{text-align:left;font-size:11px;white-space:nowrap}.patio-drawing{border:1.5px solid #111;border-left:0}.patio-drawing-head{height:.44in;background:var(--soft);border-bottom:1.5px solid #111;text-align:center;font-weight:700;font-size:12px;line-height:.44in}.patio-drawing-box{height:5.16in;padding:.05in}.patio-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);height:100%;border-top:1.5px solid #111;border-left:1.5px solid #111}.patio-cell{position:relative;border-right:1.5px solid #111;border-bottom:1.5px solid #111;display:flex;align-items:center;justify-content:center}.patio-letter{position:absolute;top:.04in;left:.045in;font-size:12px;font-weight:700}.patio-door-frame{width:.70in;height:1.08in;border:1.4px solid #111;position:relative}.patio-door-frame.blank{opacity:.85}.patio-handle{position:absolute;top:43%;width:.17in;height:.13in;border:.8px solid #111;border-radius:999px;background:#fff;font-size:5px;font-weight:700;line-height:.115in;text-align:center}.patio-handle.right{right:0}.patio-handle.left{left:0}.patio-measure{position:absolute;top:calc(43% + .065in);bottom:0;width:.12in}.patio-measure.right{right:.23in}.patio-measure.left{left:.23in}.patio-measure-line{position:absolute;left:.055in;top:.02in;bottom:.02in;border-left:.8px solid #111}.patio-measure:before,.patio-measure:after{position:absolute;left:.022in;font-size:7px;line-height:1;font-weight:700}.patio-measure:before{content:'▲';top:-.045in}.patio-measure:after{content:'▼';bottom:-.045in}.patio-measure-label{position:absolute;left:.13in;top:36%;font-size:6px;font-weight:700;white-space:nowrap;background:#fff}.patio-roller{position:absolute;bottom:0;width:.12in;height:.075in;border:.8px solid #111;background:#fff}.patio-roller.left{left:.08in}.patio-roller.right{right:.08in}.patio-special{margin-top:.08in;font-size:12px}.patio-line{display:inline-block;border-bottom:1px solid #111;width:6.2in;height:.16in}
    .shell{width:8.5in;margin:20px auto;background:#fff;border:1px solid #d8dde6;border-radius:12px;padding:16px}.notice{border-radius:12px;padding:12px;border:1px solid #d8dde6}.notice.bad{background:#fde8e8;color:#9b1c1c}.notice.warn{background:#fff4dc;color:#805000}@media print{body{background:#fff}.toolbar{display:none}.page{box-shadow:none;margin:0;width:8.5in;min-height:11in}.page:last-child{page-break-after:auto}}
  </style>
</head>
<body>
  <div class="toolbar"><div><strong>Vendor Forms Package</strong><br><small id="statusText">Loading...</small></div><div><button class="secondary" onclick="window.close()">Close</button><button onclick="window.print()">Print</button></div></div>
  <div id="vendorFormRoot"><main class="shell"><div class="notice warn">Loading vendor forms...</div></main></div>
  <script src="vendor-window-form.js"></script>
  <script src="vendor-door-form.js"></script>
  <script>
    const api='https://screen-ordering-api.nnelson.workers.dev';
    const sessionKey='screen_admin_staff_session';
    const vendorSessionKey='screen_vendor_forms_session';
    const qs=new URLSearchParams(location.search);
    const quoteId=qs.get('quote_id')||'';
    const root=document.getElementById('vendorFormRoot');
    const statusText=document.getElementById('statusText');

    function getSession(){
      try{
        const sessionValue=sessionStorage.getItem(sessionKey);
        if(sessionValue) return JSON.parse(sessionValue)||{};

        const stagedValue=localStorage.getItem(vendorSessionKey);
        if(stagedValue) return JSON.parse(stagedValue)||{};

        return {};
      }catch(e){
        return {};
      }
    }

    function token(){return getSession().token||''}
    function norm(v){return String(v||'').toLowerCase().replace(/[_-]+/g,' ').trim()}
    function isDoor(item){return norm(item.type||item.screenType)==='door'}
    async function load(){
      if(!quoteId){root.innerHTML='<main class="shell"><div class="notice bad">Missing quote_id.</div></main>';statusText.textContent='No quote selected.';return}
      const t=token();
      if(!t){root.innerHTML='<main class="shell"><div class="notice bad">No staff session found. Open this from the staff dashboard after signing in.</div></main>';statusText.textContent='Not signed in.';return}
      statusText.textContent='Loading quote '+quoteId+'...';
      const headers={'Content-Type':'application/json'};headers['Author'+'ization']='Bear'+'er '+t;
      const res=await fetch(api+'/api/quote/admin-view',{method:'POST',headers,body:JSON.stringify({quote_id:quoteId})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok||!data.ok){root.innerHTML='<main class="shell"><div class="notice bad">Unable to load quote: '+String(data.error||('HTTP '+res.status))+'</div></main>';statusText.textContent='Load failed.';return}
      const quote=data.quote||{};
      const items=data.items||[];
      const hasWindows=items.some(item=>!isDoor(item));
      const hasDoors=items.some(isDoor);
      const parts=[];
      if(hasWindows)parts.push(VendorWindowForms.render(quote,items));
      if(hasDoors)parts.push(VendorDoorForms.render(quote,items));
      if(!parts.length){root.innerHTML='<main class="shell"><div class="notice warn">No vendor form items found on this quote.</div></main>';statusText.textContent='No form items.';return}
      root.innerHTML=parts.join('');
      statusText.textContent='Loaded vendor forms for quote '+quoteId+'. Use Print to save as PDF or print.';
    }
    load().catch(err=>{root.innerHTML='<main class="shell"><div class="notice bad">Vendor form failed: '+String(err.message||err)+'</div></main>';statusText.textContent='Error.'});
  </script>
</body>
</html>
